name: Deploy to Vercel

on:
  push:
    branches: [claude/voice-expense-tracker-ai-3n3SJ, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          PROJECT_DATA=$(curl -sf "https://api.vercel.com/v9/projects/registrodefinanzas" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" || echo '{}')
          PROJECT_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          ORG_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('accountId',''))" 2>/dev/null || echo "")
          if [ -n "$PROJECT_ID" ] && [ -n "$ORG_ID" ]; then
            mkdir -p .vercel
            printf '{"projectId":"%s","orgId":"%s"}' "$PROJECT_ID" "$ORG_ID" > .vercel/project.json
            echo "Linked to Vercel project: $PROJECT_ID (org: $ORG_ID)"
          else
            echo "ERROR: Could not fetch project from Vercel API"
            echo "Raw response: $PROJECT_DATA"
            exit 1
          fi

      - name: Build with Vercel
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            2>&1

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            --env POSTGRES_URL=${{ secrets.POSTGRES_URL }} \
            --env GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            2>&1 | tee deploy-output.txt
          echo "DEPLOYMENT_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' deploy-output.txt | head -1)" >> $GITHUB_ENV

      - name: Print deployment URL
        run: |
          echo "App deployed to Vercel!"
          echo "URL: $DEPLOYMENT_URL"
