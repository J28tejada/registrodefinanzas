name: Deploy to Vercel

on:
  push:
    branches: [claude/voice-expense-tracker-ai-3n3SJ, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve Vercel project IDs
        run: |
          PROJECT_DATA=$(curl -sf "https://api.vercel.com/v9/projects/registrodefinanzas" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" || echo '{}')
          PROJECT_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          ORG_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('accountId',''))" 2>/dev/null || echo "")
          if [ -z "$PROJECT_ID" ] || [ -z "$ORG_ID" ]; then
            echo "ERROR: Could not fetch project from Vercel API"
            echo "Response: $PROJECT_DATA"
            exit 1
          fi
          echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "Resolved project: $PROJECT_ID (org: $ORG_ID)"

      - name: Sync secrets to Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json
          from urllib import request, error

          token = os.environ['VERCEL_TOKEN']
          project_id = os.environ['VERCEL_PROJECT_ID']
          base = 'https://api.vercel.com'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          secrets = {
              k: os.environ.get(k, '')
              for k in ['CLERK_SECRET_KEY', 'POSTGRES_URL', 'GROQ_API_KEY']
          }

          # Fetch existing env var IDs
          req = request.Request(f'{base}/v9/projects/{project_id}/env', headers=headers)
          try:
              with request.urlopen(req) as r:
                  existing = {
                      e['key']: e['id']
                      for e in json.loads(r.read()).get('envs', [])
                      if 'production' in e.get('target', [])
                  }
          except Exception as ex:
              print(f'WARN could not fetch existing env vars: {ex}')
              existing = {}

          for key, value in secrets.items():
              if not value:
                  print(f'SKIP {key} (not in GitHub secrets – Vercel project value kept)')
                  continue
              payload = json.dumps({
                  'key': key, 'value': value,
                  'type': 'encrypted', 'target': ['production'],
              }).encode()
              if key in existing:
                  req = request.Request(
                      f'{base}/v9/projects/{project_id}/env/{existing[key]}',
                      data=payload, headers=headers, method='PATCH')
              else:
                  req = request.Request(
                      f'{base}/v10/projects/{project_id}/env',
                      data=payload, headers=headers, method='POST')
              try:
                  with request.urlopen(req) as r:
                      print(f'OK  {key}')
              except error.HTTPError as e:
                  body = e.read().decode()[:300]
                  print(f'ERR {key}: {e.code} {body}')
          PYEOF

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            2>&1 | tee deploy-output.txt
          echo "DEPLOYMENT_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' deploy-output.txt | head -1)" >> $GITHUB_ENV

      - name: Print deployment URL
        run: echo "Deployed to $DEPLOYMENT_URL"
