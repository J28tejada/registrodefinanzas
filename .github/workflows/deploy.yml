name: Deploy to Vercel

on:
  push:
    branches: [claude/voice-expense-tracker-ai-3n3SJ, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prod \
            --yes \
            --name registrodefinanzas \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --build-env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-env NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in \
            --build-env NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up \
            --build-env NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/ \
            --build-env NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/ \
            --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --env CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            --env NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in \
            --env NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up \
            --env NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/ \
            --env NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/ \
            2>&1 | tee deploy-output.txt
          echo "DEPLOYMENT_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' deploy-output.txt | head -1)" >> $GITHUB_ENV

      - name: Print deployment URL
        run: |
          echo "✅ App deployed to Vercel!"
          echo "🔗 URL: $DEPLOYMENT_URL"
