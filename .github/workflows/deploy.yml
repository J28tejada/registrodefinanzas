name: Deploy to Vercel

on:
  push:
    branches: [claude/voice-expense-tracker-ai-3n3SJ, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve Vercel project IDs
        run: |
          PROJECT_DATA=$(curl -sf "https://api.vercel.com/v9/projects/registrodefinanzas" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" || echo '{}')
          PROJECT_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          ORG_ID=$(echo "$PROJECT_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('accountId',''))" 2>/dev/null || echo "")
          if [ -z "$PROJECT_ID" ] || [ -z "$ORG_ID" ]; then
            echo "ERROR: Could not fetch project from Vercel API"
            echo "Response: $PROJECT_DATA"
            exit 1
          fi
          echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "Resolved project: $PROJECT_ID (org: $ORG_ID)"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            --env POSTGRES_URL=${{ secrets.POSTGRES_URL }} \
            --env GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            2>&1 | tee deploy-output.txt
          echo "DEPLOYMENT_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' deploy-output.txt | head -1)" >> $GITHUB_ENV

      - name: Print deployment URL
        run: echo "Deployed to $DEPLOYMENT_URL"
