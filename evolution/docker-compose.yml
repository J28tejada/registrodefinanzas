# Evolution API para el agente de WhatsApp.
#
# Pensado para dejarlo corriendo en una máquina que no se apague: tu compu, un
# VPS chico o una Raspberry. Los datos viven en volúmenes, así que el
# emparejamiento con WhatsApp sobrevive a reinicios y actualizaciones.
#
#   cd evolution
#   cp .env.example .env     # y editá las dos claves
#   docker compose up -d
#
# Ver docs/whatsapp.md para el resto (túnel, vinculación, pruebas).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution']
      interval: 5s
      timeout: 5s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?falta EVOLUTION_API_KEY en .env}

      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@db:5432/evolution?schema=public
      # La sesión de WhatsApp se guarda: sin esto habría que re-emparejar en
      # cada reinicio.
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # El historial del chat lo guarda la app en Supabase, no hace falta acá.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'

      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_db:
  evolution_instances:
